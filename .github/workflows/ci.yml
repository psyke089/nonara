name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Gradle 9 + AGP 9 in a 2-core runner with 7 GB of RAM.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=true

jobs:
  test:
    # Every push to main: unit tests and lint only, no APK.
    if: github.ref_type == 'branch' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: tools/install-android-sdk.sh
      - run: ./gradlew testDebugUnitTest lintDebug --console=plain

  apk:
    # Tags publish a GitHub release; a manual dispatch builds the same APK without publishing.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: tools/install-android-sdk.sh
      - name: Tag must match versionName
        if: github.ref_type == 'tag'
        run: |
          name=$(sed -n 's/^val nonaraVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$name" || { echo "::error::cannot read nonaraVersionName"; exit 1; }
          test "v$name" = "$GITHUB_REF_NAME" ||
            { echo "::error::tag $GITHUB_REF_NAME does not match versionName $name"; exit 1; }
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NONARA_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" ||
            { echo "::error::secret NONARA_KEYSTORE_B64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nonara-release.jks"
      - name: Build, test and lint
        env:
          NONARA_STORE_FILE: ${{ runner.temp }}/nonara-release.jks
          NONARA_STORE_PASSWORD: ${{ secrets.NONARA_STORE_PASSWORD }}
          NONARA_KEY_ALIAS: ${{ secrets.NONARA_KEY_ALIAS }}
          NONARA_KEY_PASSWORD: ${{ secrets.NONARA_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain
      - name: Assert the APK carries the Nonara release key
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1 || true)
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          apk=$(ls app/build/outputs/apk/release/nonara-*.apk)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -q "certificate DN: CN=Nonara" "$RUNNER_TEMP/certs.txt" ||
            { echo "::error::APK is not signed with the Nonara release key"; exit 1; }
      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          for apk in nonara-*.apk; do sha256sum "$apk" >"$apk.sha256"; cat "$apk.sha256"; done
      - name: Upload preview artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: nonara-preview-apk
          path: |
            app/build/outputs/apk/release/nonara-*.apk
            app/build/outputs/apk/release/nonara-*.apk.sha256
          retention-days: 14
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/apk/release/nonara-*.apk
            app/build/outputs/apk/release/nonara-*.apk.sha256
